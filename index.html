<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>原理图</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{overflow:hidden;background:#0d0d0f;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;}
  #blur{position:fixed;inset:0;background-image:url("photo.jpg");background-size:cover;background-position:center;filter:blur(28px) brightness(.45);z-index:0;}
  #stage{position:fixed;inset:0;z-index:1;overflow:hidden;cursor:grab;touch-action:none;}
  #stage.dragging{cursor:grabbing;}
  #photo{position:absolute;top:50%;left:50%;transform-origin:center center;max-width:none;user-select:none;-webkit-user-drag:none;box-shadow:0 10px 60px rgba(0,0,0,.6);border-radius:2px;}
  #tip{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:3;background:rgba(0,0,0,.55);color:#fff;font-size:13px;padding:6px 14px;border-radius:999px;pointer-events:none;transition:opacity .4s;}
  #bar{position:fixed;right:16px;bottom:16px;z-index:3;display:flex;gap:8px;}
  #bar button{width:42px;height:42px;border:none;border-radius:10px;cursor:pointer;background:rgba(255,255,255,.14);color:#fff;font-size:19px;backdrop-filter:blur(8px);}
  #bar button:hover{background:rgba(255,255,255,.28);}
  #bar button:active{transform:scale(.94);}
  #pct{position:fixed;left:16px;bottom:22px;z-index:3;color:rgba(255,255,255,.75);font-size:12px;font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
  <div id="blur"></div>
  <div id="stage"><img id="photo" src="photo.jpg" alt="原理图"></div>
  <div id="tip">滚轮缩放 · 拖拽平移 · 双击复位</div>
  <div id="pct">100%</div>
  <div id="bar">
    <button id="zin" title="放大">＋</button>
    <button id="zout" title="缩小">－</button>
    <button id="zfit" title="完整显示">▢</button>
    <button id="zfull" title="铺满屏">⤢</button>
  </div>
<script>
var img=document.getElementById('photo'),stage=document.getElementById('stage'),pct=document.getElementById('pct'),tip=document.getElementById('tip');
var scale=1,tx=0,ty=0,natural={w:0,h:0},MIN=0.05,MAX=8;
function clampScale(s){return Math.max(MIN,Math.min(MAX,s));}
function apply(){img.style.transform='translate(-50%,-50%) translate('+tx+'px,'+ty+'px) scale('+scale+')';pct.textContent=Math.round(scale*100)+'%';}
function baseSize(){var pad=0.98,cw=stage.clientWidth*pad,ch=stage.clientHeight*pad,r=natural.w/natural.h,w=cw,h=cw/r;if(h>ch){h=ch;w=ch*r;}img.style.width=w+'px';img.style.height=h+'px';}
function fit(mode){baseSize();if(mode==='full'){var r=natural.w/natural.h,cr=stage.clientWidth/stage.clientHeight;scale=cr>r?stage.clientWidth/natural.w:stage.clientHeight/natural.h;}else{scale=1;}tx=0;ty=0;apply();}
function onReady(){natural.w=img.naturalWidth;natural.h=img.naturalHeight;fit('fit');setTimeout(function(){tip.style.opacity='0';},2600);}
if(img.complete&&img.naturalWidth)onReady();else img.addEventListener('load',onReady);
window.addEventListener('resize',function(){baseSize();apply();});
stage.addEventListener('wheel',function(e){e.preventDefault();var rect=stage.getBoundingClientRect(),mx=e.clientX-rect.left-rect.width/2,my=e.clientY-rect.top-rect.height/2,f=Math.pow(1.0015,-e.deltaY),ns=clampScale(scale*f),k=ns/scale;tx=mx-k*(mx-tx);ty=my-k*(my-ty);scale=ns;apply();},{passive:false});
var dragging=false,sx=0,sy=0,stx=0,sty=0;
function down(x,y){dragging=true;sx=x;sy=y;stx=tx;sty=ty;stage.classList.add('dragging');}
function move(x,y){if(!dragging)return;tx=stx+(x-sx);ty=sty+(y-sy);apply();}
function up(){dragging=false;stage.classList.remove('dragging');}
stage.addEventListener('mousedown',function(e){down(e.clientX,e.clientY);});
window.addEventListener('mousemove',function(e){move(e.clientX,e.clientY);});
window.addEventListener('mouseup',up);
stage.addEventListener('touchstart',function(e){if(e.touches.length===1)down(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
stage.addEventListener('touchmove',function(e){if(e.touches.length===1)move(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
stage.addEventListener('touchend',up);
stage.addEventListener('dblclick',function(){fit('fit');});
function zoomBy(f){scale=clampScale(scale*f);apply();}
document.getElementById('zin').onclick=function(){zoomBy(1.25);};
document.getElementById('zout').onclick=function(){zoomBy(0.8);};
document.getElementById('zfit').onclick=function(){fit('fit');};
document.getElementById('zfull').onclick=function(){fit('full');};
window.addEventListener('keydown',function(e){if(e.key==='+'||e.key==='=')zoomBy(1.25);else if(e.key==='-'||e.key==='_')zoomBy(0.8);else if(e.key==='0')fit('fit');else if(e.key==='f'||e.key==='F')fit('full');else if(e.key==='ArrowLeft'){tx+=60;apply();}else if(e.key==='ArrowRight'){tx-=60;apply();}else if(e.key==='ArrowUp'){ty+=60;apply();}else if(e.key==='ArrowDown'){ty-=60;apply();}});
</script>
</body>
</html>
